name: SDK verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2.4
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --parallel
      - run: swift build --package-path Examples/SmokeClient

  apple:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --parallel
      - run: swift test --package-path MoMoSDK
      - run: swift build --package-path Examples/SmokeClient
      - name: Compile declared Apple deployment floors
        run: python3 scripts/check-apple-platforms.py
      - name: Build sandbox demo without credentials
        run: xcodebuild -workspace MoMo.xcworkspace -scheme MoMoDemoApp -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
